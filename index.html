<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium To-Do List | Kelompok 2</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Modular CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Main Application Container -->
  <div class="todo-container">
    <header>
      <h1>Task Master</h1>
      <button class="theme-toggle" id="themeToggle" title="Toggle Dark Mode">
        <i class="fas fa-sun"></i>
      </button>
    </header>

    <!-- Input Section -->
    <div class="input-section">
      <input type="text" id="todoInput" placeholder="What needs to be done?" />
      <input type="date" id="todoDate" title="Due Date" />
      <select id="todoPriority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <button id="addTodoBtn" title="Add Task"><i class="fas fa-plus"></i></button>
    </div>

    <!-- Search Bar -->
    <div class="search-container">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Search tasks..." />
    </div>

    <!-- Filters Section -->
    <div class="filters">
      <div class="filter-btns">
        <button data-filter="all" class="active">All</button>
        <button data-filter="active">Active</button>
        <button data-filter="completed">Completed</button>
      </div>
      <button class="clear-btn" id="clearCompletedBtn">Clear Completed</button>
    </div>

    <!-- Todo List -->
    <ul class="todo-list" id="todoList">
      <!-- Todos are dynamically injected here -->
    </ul>

    <!-- Stats Bar -->
    <div class="stats-bar" id="statsBar">
      <div class="stats-item">Total: <b id="totalTasks">0</b></div>
      <div class="stats-item">Pending: <b id="pendingTasks">0</b></div>
      <div class="stats-item">Done: <b id="doneTasks">0</b></div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <h2>Edit Task</h2>
      <input type="text" id="editTodoInput" placeholder="Edit todo..." />
      <input type="date" id="editTodoDate" />
      <select id="editTodoPriority">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
      <div class="modal-actions">
        <button class="cancel-btn" id="cancelEditBtn">Cancel</button>
        <button class="save-btn" id="saveEditBtn">Update</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Footer -->
  <footer>
    &copy; 2025 Kelompok 2 | <a href="https://github.com/ramazancetinkaya/simple-todolist" target="_blank">Base Fork</a>
  </footer>

  <!-- Modular JS -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
